<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Signup</title>
</head>
<body>
<div align="center">
    <form action="/signup" method="POST">
    <div>Register</div>
    <div>
    <table>
        <tr><td><input type="email" class="form-control" name="uname" aria-describedby="emailHelp" placeholder="example@domain.com"></td></tr>
        <tr><td><input type="password" class="form-control" name="password" placeholder="Password"></td></tr>
        <tr><td><input type="text" class="form-control" name="full_name" placeholder="Full name"></td></tr>
        <tr><td><input type="text" class="form-control" name="address" placeholder="Address"></td></tr>
        <tr><td><input type="text" class="form-control" name="phno" placeholder="Phone no."></td></tr>
        <tr><td align="center"><button type="submit" class="btn_solid theme_primary">Signup</button></td></tr>
        <tr><td align="center">Existing user? <a href="login.html">Login</a></td></tr>
    </table>
    </div>
    </form>
</div>
</body>
</html>
