{% extends "admin_navbar.html" %}

    <div>
    <table>

        <tr><td align="center"><button type="submit" class="btn-solid theme-primary">Update</button> <a href="{{url_for('admin_dashboard',user_id=user.id)}}" class="btn-solid theme-primary">Close</a></td></tr>
    </table>
    </div>
    </form>
    </div>
{% endblock %}
