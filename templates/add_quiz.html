{% extends "admin_navbar.html" %}
{%block admin_navbar%}
    <div align="center">
    <form action="{{ url_for('add_quiz', user_id=user.id) }}" method="POST">
    <div>Add Quiz</div>
    <div>
    <table>
        <tr>
            <td>
                <select name="chapter_id" class="form-control" required>
                <option value="">Select Chapter</option>
                    {% for chapter in chapters %}
                    <option value="{{ chapter.id }}">
                        {{ chapter.title }}
                    </option>
                    {% endfor %}
                </select>
            </td>
        </tr>
        <tr><td><input type="text" class="form-control" name="title" placeholder="Quiz title"></td></tr>
        <tr><td><input type="text" class="form-control" name="description" placeholder="Description"></td></tr>
        <tr><td align="center"><button type="submit" class="btn-solid theme-primary">Save</button> <a href="{{ url_for('manage_quizzes', user_id=user.id) }}" class="btn-solid theme-primary">Close</a></td></tr>
    </table>
    </div>
    </form>
    </div>
{% endblock %}
