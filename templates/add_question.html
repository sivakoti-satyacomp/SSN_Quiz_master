{% extends "admin_navbar.html" %}
{%block admin_navbar%}
    <div align="center">
    <form action="{{ url_for('add_question',user_id=user.id,quiz_id=quiz.id) }}" method="POST">
    <div>Add Question</div>
    <div>
    <table>
        <tr><td><input type="text" class="form-control" name="title" placeholder="Title"></td></tr>
        <tr><td><input type="text" class="form-control" name="description" placeholder="Description"></td></tr>
        <tr><td>
            <div class="form-field">
                <input type="text" class="form-control" name="opt_1" placeholder="Option 1">
            </div>
        </td></tr>
        <tr><td>
            <div class="form-field">
                <input type="text" class="form-control" name="opt_2" placeholder="Option 2">
            </div>
        </td></tr>
        <tr><td>
            <div class="form-field">
                <input type="text" class="form-control" name="opt_3" placeholder="Option 3">
            </div>
        </td></tr>
        <tr><td>
            <div class="form-field">
                <input type="text" class="form-control" name="opt_4" placeholder="Option 4">
            </div>
        </td></tr>
        <tr><td>
            <div class="form-field">
                <input type="text" class="form-control" name="correct_choice" placeholder="1/2/3/4">
            </div>
        </td></tr>
        <tr><td>
            <div class="form-field">
                <input type="text" class="form-control" name="marks" placeholder="marks">
            </div>
        </td></tr>
        <tr><td align="center"><button type="submit" class="btn-solid theme-primary">Save</button> <a href="/admin" class="btn-solid theme-primary">Close</a></td></tr>
    </table>
    </div>
    </form>
    </div>
{% endblock %}
